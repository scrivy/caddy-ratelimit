# Workflow to build and push an image to GitHub Container Registry
name: Build caddy-ratelimit

# Controls when the action will run
on:
  workflow_dispatch:  # allows to run the workflow manually from the Actions tab
  schedule:
    - cron: '0 0 1 * *'  # runs at 00:00 on the first day of every month
  push:
    branches: trunk

# Prevent overlapping runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Environment variables available to all jobs and steps in this workflow
env:
  DOCKER_BUILDKIT: 1
  IMAGE_NAME: caddy-ratelimit
  IMAGE_DESCRIPTION: "Caddy custom build with Rate Limit module"

# Jobs to run once the workflow is triggered
jobs:
  # Job to get image and repository details
  metadata:
    name: Get image and repository details
    runs-on: ubuntu-latest

    outputs:
      labels: ${{ steps.metadata.outputs.labels }}
      platforms: linux/amd64
#      platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x,linux/arm/v7,linux/arm/v6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: trunk

      - name: Generate image metadata
        uses: docker/metadata-action@v6
        id: metadata
        with:
          images: |
            ghcr.io/${{ github.actor }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}

  # Job to build and publish image
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: metadata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: trunk

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish container image
        uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ./Containerfile
          push: true
          provenance: false
          tags: latest
          labels: ${{ needs.metadata.outputs.labels }}
          platforms: ${{ needs.metadata.outputs.platforms }}
