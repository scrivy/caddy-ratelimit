# Workflow to build and push an image to GitHub Container Registry
name: Build caddy-ratelimit

# Controls when the action will run
on:
  workflow_dispatch:  # allows to run the workflow manually from the Actions tab
  schedule:
    - cron: '0 0 1 * *'  # runs at 00:00 on the first day of every month
  push:
    branches: trunk

# permissions are needed if pushing to ghcr.io
permissions: 
  packages: write

# Prevent overlapping runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Environment variables available to all jobs and steps in this workflow
env:
  DOCKER_BUILDKIT: 1
  IMAGE_DESCRIPTION: "Caddy custom build with Rate Limit module"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Jobs to run once the workflow is triggered
jobs:
  # Job to get image and repository details
  metadata:
    name: Get image and repository details
    runs-on: ubuntu-latest

    outputs:
      labels: ${{ steps.metadata.outputs.labels }}
      platforms: linux/amd64
#      platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x,linux/arm/v7,linux/arm/v6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

  # Job to build and publish image
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: metadata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - name: Build and publish container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ needs.metadata.outputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
